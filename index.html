.tot{border-top:2px solid var(--gold);margin-top:4px;padding-top:4px;font-weight:700}
.g{color:var(--ok)}.r{color:var(--bad)}
.scroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}

button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--navy);color:#fff;font-weight:700;line-height:1.3}
button.gold,.seg button.on,.chip.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--navy)}
button.alt{background:transparent;color:var(--navy);border:1px solid var(--navy)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.chip{flex:1 1 60px;background:#e4e9f4;color:var(--navy);padding:10px 4px}
.chip.on{background:var(--navy);color:#fff}
.menu{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.bar{height:12px;border-radius:6px;background:#dfe5f1;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--gold))}

#login{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,var(--navy),#142b5e);overflow:auto}

const blank=date=>({date,staff:"",rP:"",rD:"",rC:"",pS:"",pA:"",hS:"",hA:"",ob:"",oi:"",oo:"",dip:{h:"",p:"",c:""},chk:{},att:{},fl:[],noz:NOZ.map(()=>({s:"",e:""})),itm:ITM.map(()=>({q:"",r:""})),ud:[{n:"",t:"",u:"",w:""},{n:"",t:"",u:"",w:""},{n:"",t:"",u:"",w:""}],kh:[{c:"Other",t:"",a:""},{c:"Other",t:"",a:""}]});
let d=blank(new Date().toISOString().slice(0,10)),m={cu:[],st:[]},unsub=null,timer=null,pos={f:"HSD",nz:1,amt:"",ltr:""},cur="home";
const n=v=>parseFloat(v)||0,f=v=>Math.round(v*100)/100,fmt=v=>Number(v).toLocaleString("en-PK");
function labels(){$$("[data-bi]").forEach(e=>{const[a,b]=e.dataset.bi.split("|");e.innerHTML=bi(a,b)});$$("[data-ph]").forEach(e=>e.placeholder=e.dataset.ph.replace("|"," / "))}
const inp=(p,v,ph="",mo="decimal")=>`<input data-p="${p}" inputmode="${mo}" placeholder="${ph.replace("|"," / ")}" value="${v??""}">`;
function T(d){const c={};let nl=0,na=0,pl=0,hl=0;
 d.noz.forEach((x,i)=>{const L=Math.max(0,n(x.e)-n(x.s)),ds=i<4,A=L*n(ds?d.rD:d.rP);c["nl"+i]=f(L);c["na"+i]=f(A);nl+=L;na+=A;ds?hl+=L:pl+=L});
 let ia=0;d.itm.forEach((x,i)=>{const A=n(x.q)*n(x.r);c["ia"+i]=f(A);ia+=A});
 const ua=d.ud.reduce((s,x)=>s+n(x.u),0),wa=d.ud.reduce((s,x)=>s+n(x.w),0),ka=d.kh.reduce((s,x)=>s+n(x.a),0);
 const cl=d.fl.filter(x=>x.f==="CNG").reduce((s,x)=>s+n(x.l),0);
 Object.assign(c,{nozL:f(nl),nozA:f(na),itmA:f(ia),udA:f(ua),wsA:f(wa),khA:f(ka),pA:n(d.pA),hA:n(d.hA),pT:f(n(d.pS)+n(d.pA)),pL:f(pl),hT:f(n(d.hS)+n(d.hA)),hL:f(hl),cL:f(cl),tL:f(nl+cl)});
 c.pB=f(c.pT-pl);c.hB=f(c.hT-hl);c.pD=n(d.dip.p);c.hD=n(d.dip.h);c.pF=d.dip.p===''?0:f(c.pD-c.pB);c.hF=d.dip.h===''?0:f(c.hD-c.hB);c.sale=f(na+ia);c.cs=f(na+ia-ua);c.cash=f(na+ia-ua+wa-ka);c.cb=f(n(d.ob)+c.cash+n(d.oi)-n(d.oo));return c}
function draw(){
 $("#noz").innerHTML=d.noz.map((x,i)=>`<tr><td>${bi(...NOZ[i])}</td><td>${inp(`noz.${i}.s`,x.s)}</td><td>${inp(`noz.${i}.e`,x.e)}</td><td data-c="nl${i}">0</td><td data-c="na${i}">0</td></tr>`).join("");
 $("#itm").innerHTML=d.itm.map((x,i)=>`<tr><td>${bi(...ITM[i])}</td><td>${inp(`itm.${i}.q`,x.q,"","numeric")}</td><td>${inp(`itm.${i}.r`,x.r)}</td><td data-c="ia${i}">0</td></tr>`).join("");
 $("#ud").innerHTML=d.ud.map((x,i)=>`<tr><td>${inp(`ud.${i}.n`,x.n,"Vehicle/Name|گاڑی/نام","text")}</td><td>${inp(`ud.${i}.t`,x.t,"Details|تفصیل","text")}</td><td>${inp(`ud.${i}.u`,x.u)}</td><td>${inp(`ud.${i}.w`,x.w)}</td></tr>`).join("");
 $("#kh").innerHTML=d.kh.map((x,i)=>`<tr><td><select data-p="kh.${i}.c">${CATS.map(c=>`<option value="${c[0]}"${x.c===c[0]?" selected":""}>${c[0]} / ${c[1]}</option>`).join("")}</select></td><td>${inp(`kh.${i}.t`,x.t,"Details|تفصیل","text")}</td><td>${inp(`kh.${i}.a`,x.a)}</td></tr>`).join("");
 $$("[data-p]").forEach(e=>{if(e.closest("table"))return;const v=get(e.dataset.p);e.type==="checkbox"?e.checked=!!v:e.value=v??""});
 $("#date").value=d.date;calc();all();$$("[data-p]").forEach(e=>{if(e.closest("table"))return;const v=get(e.dataset.p);e.type==="checkbox"?e.checked=!!v:e.value=v??""})}
function get(p){return p.split(".").reduce((o,k)=>o?.[k],d)}
function set(p,v){const k=p.split(".");const l=k.pop();k.reduce((o,x)=>o[x]??={},d)[l]=v}
function calc(){const c=T(d);$$("[data-c]").forEach(e=>e.textContent=fmt(c[e.dataset.c]??0));
 $("#close").innerHTML=d.closed?bi("Day Closed ✓ (close again)","ڈے کلوز ہو چکا ✓ (دوبارہ کلوز)"):bi("Close Day","ڈے کلوز کریں");
 const mx=Math.max(c.hL,c.pL,c.cL,1);$("#fbars").innerHTML=[["HSD","ایچ ایس ڈی",c.hL],["Petrol","پیٹرول",c.pL],["CNG","سی این جی",c.cL]].map(x=>`<div style="margin:6px 0"><div class="ln"><span>${bi(x[0],x[1])}</span><b>${fmt(x[2])}</b></div><div class="bar"><i style="width:${x[2]/mx*100}%"></i></div></div>`).join("");
 tkBars();
 }
function tkDraw(){$("#tanks").innerHTML=TANKS.map(t=>{const v=n(d.dip[t[0]]),p=Math.min(100,Math.round(v/t[3]*100));return`<div class="card" style="margin-bottom:10px"><div class="ln"><b>${bi(t[1],t[2])}</b><span data-tp="${t[0]}">${p}%</span></div><div class="bar"><i data-tb="${t[0]}" style="width:${p}%"></i></div><div class="ln"><span data-x>${bi("Current Stock (Ltr)","موجودہ سٹاک (لیٹر)")}</span>${inp("dip."+t[0],d.dip[t[0]])}</div><small>${bi("Capacity","گنجائش")} ${fmt(t[3])} Ltr</small></div>`}).join("");
}
function tkBars(){TANKS.forEach(t=>{const p=Math.min(100,Math.round(n(d.dip[t[0]])/t[3]*100));const a=$(`[data-tp="${t[0]}"]`),b=$(`[data-tb="${t[0]}"]`);if(a)a.textContent=p+"%";if(b)b.style.width=p+"%"})}
function all(){tkDraw();flDraw();stDraw();cuDraw()}
function flDraw(){
 $("#pf").innerHTML=FUELS.map(x=>`<button class="chip ${pos.f===x[0]?"on":""}" data-pf="${x[0]}">${bi(x[0],x[1])}</button>`).join("");
 $("#pn").innerHTML=[1,2,3,4].map(i=>{const k=pos.f==="Petrol"?i+4:i;return`<button class="chip ${pos.nz===k?"on":""}" data-pn="${k}">${k}</button>`}).join("");
 $("#pa").innerHTML=[500,1000,2000].map(v=>`<button class="chip ${pos.amt==v?"on":""}" data-pa="${v}">${v}</button>`).join("");
 $("#pl").innerHTML=[10,20,50].map(v=>`<button class="chip ${pos.ltr==v?"on":""}" data-pl="${v}">${v}</button>`).join("");
 const tot=d.fl.reduce((s,x)=>s+n(x.a),0);
 $("#fl").innerHTML=d.fl.length?d.fl.map((x,i)=>`<div class="rep"><span>${x.f} · N${x.z}</span><span>${fmt(x.l)} L · Rs. ${fmt(x.a)} <a data-fd="${i}" style="color:var(--bad);cursor:pointer">✕</a></span></div>`).join("")+`<div class="ln tot"><span>${bi("Total","کل")}</span><b>Rs. ${fmt(f(tot))}</b></div>`:bi("No fueling entries yet","ابھی کوئی فیولنگ اندراج نہیں")}
function stDraw(){$("#stl").innerHTML=m.st.length?m.st.map((x,i)=>`<div class="ln"><span>${x.n} <small>${x.r||""}</small></span><input type="checkbox" data-at="${x.n}" ${d.att[x.n]?"checked":""}></div>`).join(""):bi("No staff added","کوئی سٹاف شامل نہیں")}
function cuDraw(){const q=($("#cq").value||"").toLowerCase();const l=m.cu.map((x,i)=>[x,i]).filter(([x])=>x.n.toLowerCase().includes(q));
 $("#cul").innerHTML=l.length?l.map(([x,i])=>`<div class="rep" data-cu="${i}" style="cursor:pointer"><span>${x.n}</span><b>Rs. ${fmt(x.b)}</b></div>`).join("")+`<div class="ln tot"><span>${bi("Total","کل")}</span><b>Rs. ${fmt(m.cu.reduce((s,x)=>s+n(x.b),0))}</b></div>`:bi("No customers","کوئی کسٹمر نہیں")}
function status(a,b){$("#st").textContent=a+" · "+b}
function save(){if(!auth.currentUser)return;status("Saving…","محفوظ ہو رہا ہے");clearTimeout(timer);timer=setTimeout(()=>setDoc(doc(db,"days",d.date),d).catch(()=>status("Error","خرابی")),500)}
const saveM=()=>setDoc(doc(db,"meta","main"),m).catch(()=>status("Error","خرابی"));
async function prevFill(){try{const q=await getDocs(query(collection(db,'days'),orderBy('date','desc'),limit(60)));const p=q.docs.map(x=>x.data()).find(x=>x.date<d.date);if(!p||d.pS!==''||d.hS!=='')return;const c=T(Object.assign(blank(p.date),p));d.pS=c.pB;d.hS=c.hB;if(d.ob==='')d.ob=c.cb;draw();save()}catch(e){}}
function load(date){if(unsub)unsub();let first=true,filled=false;d=blank(date);draw();
 unsub=onSnapshot(doc(db,"days",date),{includeMetadataChanges:true},s=>{
  if(first&&s.exists()&&!s.metadata.hasPendingWrites){d=Object.assign(blank(date),s.data());draw()}
  else if(first&&!s.exists()&&!s.metadata.hasPendingWrites&&!filled){filled=true;prevFill()}
  if(!s.metadata.hasPendingWrites&&!s.metadata.fromCache)first=false;
  if(s.metadata.hasPendingWrites)status("Offline – sync pending","آف لائن – سنک باقی");
  else if(s.metadata.fromCache&&!navigator.onLine)status("Offline","آف لائن");else status("✓ Synced","✓ سنک")})}
document.addEventListener("input",e=>{const t=e.target;if(t.id==="cq")return cuDraw();if(t.id==="pc"){pos.amt=t.value;pos.ltr="";return}
 const p=t.dataset?.p;if(!p)return;set(p,t.type==="checkbox"?t.checked:t.value);calc();save()});
document.addEventListener("change",e=>{const a=e.target.dataset?.at;if(a){d.att[a]=e.target.checked;save()}});
$("#date").onchange=e=>{if(e.target.value)load(e.target.value)};
$("#addU").onclick=()=>{d.ud.push({n:"",t:"",u:"",w:""});draw();save()};
$("#addK").onclick=()=>{d.kh.push({c:"Other",t:"",a:""});draw();save()};
$("#addS").onclick=()=>{const a=prompt("Staff name / سٹاف کا نام");if(!a)return;m.st.push({n:a,r:prompt("Role / عہدہ")||""});stDraw();saveM()};
$("#addC").onclick=()=>{const a=prompt("Customer name / کسٹمر کا نام");if(!a)return;m.cu.push({n:a,b:n(prompt("Balance / بیلنس (Rs.)"))});cuDraw();saveM()};
$("#sf").onclick=()=>{const fu=FUELS.find(x=>x[0]===pos.f),r=n(d[fu[2]]);let a=n(pos.amt),l=n(pos.ltr);if(!r){alert("Set rate on Home / ہوم پر ریٹ لکھیں");return}
 if(a)l=f(a/r);else if(l)a=f(l*r);else return;d.fl.push({f:pos.f,z:pos.nz,l,a});pos.amt=pos.ltr="";$("#pc").value="";draw();save()};
function go(t){cur=t;$$("[data-tab]").forEach(e=>e.classList.toggle("hide",e.dataset.tab!==t));$$("#nav [data-go]").forEach(b=>b.classList.toggle("on",b.dataset.go===t));scrollTo(0,0);if(t==="reports")reps()}
let R=[],rm="Daily";
async function reps(){const el=$("#reps");el.innerHTML=bi("Loading…","لوڈ ہو رہا ہے");
 try{const q=await getDocs(query(collection(db,"days"),orderBy("date","desc"),limit(400)));R=q.docs.map(x=>x.data());rdraw()}catch(e){el.innerHTML=bi("Could not load reports","رپورٹس لوڈ نہیں ہوئیں")}}
function rdraw(){const el=$("#reps");let L=R.map(r=>({k:r.date,c:T(Object.assign(blank(r.date),r)),z:r.closed}));
 if(rm==="Monthly"){const g={};L.forEach(x=>{const k=x.k.slice(0,7);const o=g[k]??={k,c:{sale:0,tL:0,khA:0,cash:0}};for(const y in o.c)o.c[y]+=x.c[y]});L=Object.values(g)}
 if(rm==="Custom"){const a=$("#rf").value,b=$("#rt").value;L=L.filter(x=>(!a||x.k>=a)&&(!b||x.k<=b));const o={k:(a||"…")+" → "+(b||"…"),c:{sale:0,tL:0,khA:0,cash:0}};L.forEach(x=>{for(const y in o.c)o.c[y]+=x.c[y]});L=[o]}
 el.innerHTML=L.length?L.map(x=>`<div class="rep" data-d="${rm==="Daily"?x.k:""}" style="${rm==="Daily"?"cursor:pointer":""}"><span>${x.k}${x.z?" ✓":""}</span><span style="text-align:right">${bi("Sale "+fmt(f(x.c.sale))+" · "+fmt(f(x.c.tL))+" L","سیل / لیٹر")}<small>${bi("Exp "+fmt(f(x.c.khA))+" · Cash "+fmt(f(x.c.cash)),"خرچہ / کیش")}</small></span></div>`).join(""):bi("No records yet","ابھی کوئی ریکارڈ نہیں")}
$("#rf").onchange=$("#rt").onchange=rdraw;
document.addEventListener("click",e=>{const t=e.target,B=s=>t.closest(s);let x;
 if(x=B("[data-seg]")){const[g,v]=x.dataset.seg.split(":");x.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===x));$$(`[data-pane^="${g}:"]`).forEach(p=>p.classList.toggle("hide",p.dataset.pane!==x.dataset.seg));if(g==="rp"){rm=v;$("#rcus").classList.toggle("hide",v!=="Custom");rdraw()}return}
 if(x=B("[data-go]"))return go(x.dataset.go);
 if(x=B("[data-pf]")){pos.f=x.dataset.pf;pos.nz=pos.f==="Petrol"?5:1;return flDraw()}
 if(x=B("[data-pn]")){pos.nz=+x.dataset.pn;return flDraw()}
 if(x=B("[data-pa]")){pos.amt=x.dataset.pa;pos.ltr="";$("#pc").value=pos.amt;return flDraw()}
 if(x=B("[data-pl]")){pos.ltr=x.dataset.pl;pos.amt="";$("#pc").value="";return flDraw()}
 if(x=B("[data-fd]")){d.fl.splice(+x.dataset.fd,1);draw();return save()}
 if(x=B("[data-cu]")){const i=+x.dataset.cu,v=prompt("Balance / بیلنس (Rs.)",m.cu[i].b);if(v!==null){m.cu[i].b=n(v);cuDraw();saveM()}return}
 if(x=B(".rep[data-d]")){if(x.dataset.d){load(x.dataset.d);go("home")}return}
 if(B("[data-soon]"))alert("Coming soon / جلد آ رہا ہے");
 if(B("#prof"))alert("Daata Petroleum (PSO)\n13KM Vehari Road, Burewala, Near 37 Phatak\n0300-6994891 / 0300-3637489");
 if(B("#eye")){const p=$("#pw");p.type=p.type==="password"?"text":"password"}});
$("#close").onclick=()=>{if(confirm("Close today? / آج کا دن کلوز کریں؟")){d.closed=true;calc();save()}};
$("#bk").onclick=async()=>{const q=await getDocs(collection(db,"days"));const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify({days:q.docs.map(x=>x.data()),meta:m},null,1)],{type:"application/json"}));l.download="pump-backup-"+new Date().toISOString().slice(0,10)+".json";l.click()};
$("#lg").onclick=()=>{$("#err").textContent="";signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value).catch(()=>$("#err").textContent="Wrong email/password or no internet / ای میل یا پاسورڈ غلط ہے (یا انٹرنیٹ نہیں)")};
$("#out").onclick=()=>signOut(auth);
let mu=null;
onAuthStateChanged(auth,u=>{["#login"].forEach(s=>$(s).classList.toggle("hide",!!u));$("#app").classList.toggle("hide",!u);$("#nav").classList.toggle("hide",!u);
 if(u){load(d.date);mu=onSnapshot(doc(db,"meta","main"),s=>{if(s.exists()){m=Object.assign({cu:[],st:[]},s.data());stDraw();cuDraw()}})}else{if(unsub)unsub();if(mu)mu()}});
addEventListener("online",()=>status("Syncing…","سنک ہو رہا ہے"));addEventListener("offline",()=>status("Offline","آف لائن"));
labels();draw();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
